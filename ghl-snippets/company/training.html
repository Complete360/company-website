     COMPLETE360 TRAINING GALLERY — v1.2
     v1.2 (2026-11-10): Google Ads 90-day satisfaction guarantee removed from every
       script, table and close (pricing rows, guarantee section, value table,
       objection answers, Guarantee-Backed close -> Lowest-Rate close, pitch).
       Replaces the v1.1 note below that left it pending.
     v1.1 (2026-11-10): sales scripts matched to the Terms / Return & Refund
       Policy v2.1 across every product: 10 days' written notice to cancel
       (was 30 days / "cancel anytime"), prepaid plans non-refundable from
       purchase, CRM 30-day money-back guarantee removed (risk-reversal close
       now leans on the 14-day trial), AI "no per-minute AI fees" with phone
       service billed separately. (Ads guarantee scripts: see v1.2.)
     Paste into a GHL Custom Code / HTML element on /training.
     Set the section/container to FULL WIDTH; the widget centers
     itself and caps reading width on its own.

     All styles/scripts namespaced under #c360t-app and the
     c360t- prefix so it will NOT collide with the global
     header (c360-) or footer (c360f-).

     ---------------------------------------------------------------
     PASSWORD GATE — READ THIS:
     The gate below is a *soft* client-side lock (password:
     Complete360!). It keeps casual visitors out and signals
     "internal," but it is NOT real security — the password lives
     in this code and anyone who views source or disables JS can
     bypass it. Do not put anything genuinely sensitive behind it.
     For real protection, use GHL's native membership/access
     controls on the /training page instead.
     Change the password in the CONFIG block at the top of the
     script (look for GATE_PASSWORD).
     ---------------------------------------------------------------

     Doc content lives NATIVELY inside this file — nothing loads
     from Google, so nothing can be blocked. To add a template's
     content, edit the DATA object near the bottom (the only edit
     zone). Optional call-recording audio is supported too.
     ============================================================ -->

<div id="c360t-app">

  <!-- ===== PASSWORD GATE ===== -->
  <div id="c360t-gate" class="c360t-gate">
    <div class="c360t-gate-card">
      <a href="/" class="c360t-gate-logo">
        <span class="c360t-logo-complete">Complete</span><span class="c360t-logo-360">360</span>
      </a>
      <div class="c360t-gate-badge">Team Training</div>
      <h1 class="c360t-gate-title">This area is for the team.</h1>
      <p class="c360t-gate-sub">Enter the training password to continue.</p>

      <form id="c360t-gate-form" class="c360t-gate-form" autocomplete="off">
        <div class="c360t-gate-inputwrap">
          <svg class="c360t-gate-lockico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="c360t-gate-input" type="password" placeholder="Training password" aria-label="Training password" autocomplete="off">
          <button type="button" id="c360t-gate-eye" class="c360t-gate-eye" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <button type="submit" class="c360t-gate-btn">Enter Training</button>
        <p id="c360t-gate-error" class="c360t-gate-error" hidden>That password isn't right. Try again.</p>
      </form>

      <p class="c360t-gate-foot">Complete360 &middot; Internal use only</p>
    </div>
  </div>

  <!-- ===== GALLERY (revealed after gate) ===== -->
  <div id="c360t-gallery" class="c360t-gallery" hidden>
    <div class="c360t-inner">

      <!-- Top bar: brand/track tabs + search -->
      <header class="c360t-top">
        <div class="c360t-brandbar" id="c360t-brandbar"></div>
        <div class="c360t-searchwrap">
          <svg class="c360t-search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="c360t-search" type="search" placeholder="Search training…" autocomplete="off" aria-label="Search training">
        </div>
      </header>

      <nav class="c360t-crumbs" id="c360t-crumbs" aria-label="Breadcrumb"></nav>
      <div class="c360t-head" id="c360t-head"></div>
      <main class="c360t-grid" id="c360t-grid" aria-live="polite"></main>

      <div class="c360t-empty" id="c360t-empty" hidden>
        <strong>Nothing here yet.</strong>
        <span>Try another category or clear your search.</span>
      </div>

    </div><!-- /.c360t-inner -->
  </div>

  <!-- ===== Lightbox modal ===== -->
  <div class="c360t-modal" id="c360t-modal" role="dialog" aria-modal="true" aria-labelledby="c360t-modal-title" hidden>
    <div class="c360t-modal-backdrop" data-close></div>
    <div class="c360t-modal-card" role="document">
      <div class="c360t-modal-head">
        <div class="c360t-modal-titlewrap">
          <span class="c360t-modal-eyebrow" id="c360t-modal-eyebrow"></span>
          <h3 class="c360t-modal-title" id="c360t-modal-title"></h3>
        </div>
        <div class="c360t-modal-actions">
          <button class="c360t-btn c360t-btn-copy" id="c360t-modal-copy" type="button">Copy text</button>
          <button class="c360t-modal-x" data-close aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="c360t-modal-body" id="c360t-modal-body"></div>
    </div>
  </div>

</div>


<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

#c360t-app{
  --navy:#122078; --navy-deep:#0d1654; --navy-mid:#1a2e99;
  --green:#127825; --green-deep:#0e5e1d; --green-light:#1a9e32;
  --sand:#F1EFE8; --sand-deep:#E8E5DB;
  --white:#FFFFFF; --ink:#0F1F5E; --muted:#5F5E5A;
  --line:#E1DED3; --line-soft:#ECE9E0;
  --green-tint:#EAF3DE; --blue-tint:#E6F1FB;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,32,120,.06), 0 14px 30px -14px rgba(18,32,120,.22);
  font-family:'Poppins','Helvetica Neue',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#c360t-app *{box-sizing:border-box;}

/* Ensure the hidden attribute always wins over class display rules
   (class selectors otherwise override the browser's [hidden]=display:none,
   which is what left the gate visible after unlocking). */
#c360t-app [hidden]{display:none !important;}

/* logo lockup (shared) */
.c360t-logo-complete{color:var(--navy);}
.c360t-logo-360{color:var(--green);}

/* ============================================================
   PASSWORD GATE
   ============================================================ */
.c360t-gate{
  min-height:78vh;
  display:flex;align-items:center;justify-content:center;
  padding:48px 20px;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(18,32,120,.06), transparent 60%),
    var(--sand);
  /* full-bleed band */
  margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
}
.c360t-gate-card{
  width:100%;max-width:440px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:44px 40px 32px;
  text-align:center;
  box-shadow:0 1px 2px rgba(18,32,120,.05), 0 30px 60px -30px rgba(18,32,120,.35);
  animation:c360t-rise .4s cubic-bezier(.2,.8,.2,1);
}
@keyframes c360t-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.c360t-gate-logo{
  display:inline-block;font-size:26px;font-weight:700;letter-spacing:-.4px;
  text-decoration:none;margin-bottom:22px;
}
.c360t-gate-badge{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  color:var(--green);background:var(--green-tint);
  padding:5px 12px;border-radius:6px;margin-bottom:18px;
}
.c360t-gate-title{
  font-size:24px;font-weight:600;line-height:1.2;color:var(--navy);
  margin:0 0 8px;letter-spacing:-.3px;
}
.c360t-gate-sub{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.5;}
.c360t-gate-form{display:flex;flex-direction:column;gap:12px;}
.c360t-gate-inputwrap{position:relative;display:flex;align-items:center;}
.c360t-gate-lockico{
  position:absolute;left:15px;width:18px;height:18px;color:var(--muted);pointer-events:none;
}
#c360t-gate-input{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--sand);border:1.5px solid var(--line);border-radius:10px;
  padding:14px 46px 14px 44px;outline:none;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
#c360t-gate-input:focus{border-color:var(--navy);background:var(--white);box-shadow:0 0 0 3px rgba(18,32,120,.12);}
.c360t-gate-eye{
  position:absolute;right:8px;width:34px;height:34px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,color .15s ease;
}
.c360t-gate-eye:hover{background:var(--sand-deep);color:var(--navy);}
.c360t-gate-eye svg{width:19px;height:19px;}
.c360t-gate-btn{
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.2px;
  color:#fff;background:var(--green);border:none;border-radius:10px;
  padding:14px 20px;cursor:pointer;margin-top:4px;
  transition:background .2s ease, transform .1s ease;
}
.c360t-gate-btn:hover{background:var(--green-deep);}
.c360t-gate-btn:active{transform:scale(.99);}
.c360t-gate-error{
  font-size:13px;color:#c0392b;margin:2px 0 0;font-weight:500;
}
.c360t-gate-card.c360t-shake{animation:c360t-shake .4s;}
@keyframes c360t-shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-8px);}
  40%,80%{transform:translateX(8px);}
}
.c360t-gate-foot{font-size:11px;color:var(--muted);margin:24px 0 0;letter-spacing:.2px;}

/* ============================================================
   GALLERY
   ============================================================ */
.c360t-gallery{
  background:var(--sand);
  /* full-bleed band */
  margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
}
.c360t-inner{max-width:1180px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 60px;}

/* top bar */
.c360t-top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px;}

/* ===== TRACK PICKER (dropdown that replaced the old row of tabs) ===== */
.c360t-brandbar{position:relative;display:flex;flex-direction:column;gap:6px;min-width:min(300px,100%);}
.c360t-track-label{
  display:flex;align-items:center;gap:6px;
  font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);
}
.c360t-track-label svg{width:14px;height:14px;}
.c360t-track-trigger{
  font-family:inherit;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--white);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 14px;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease;
}
.c360t-track-trigger:hover{border-color:var(--navy);}
.c360t-track-trigger[aria-expanded="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,32,120,.12);}
.c360t-track-trigger:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
.c360t-track-trig-main{flex:1;min-width:0;}
.c360t-track-trig-name{display:block;font-weight:600;font-size:15px;color:var(--navy);line-height:1.2;letter-spacing:-.2px;}
.c360t-track-trig-sub{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c360t-track-chev{flex-shrink:0;width:20px;height:20px;color:var(--muted);transition:transform .2s ease;}
.c360t-track-trigger[aria-expanded="true"] .c360t-track-chev{transform:rotate(180deg);}

.c360t-track-menu{
  position:absolute;top:100%;left:0;z-index:60;margin-top:8px;
  width:min(440px,90vw);background:var(--white);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:8px;animation:c360t-rise .16s ease;
  max-height:min(72vh,560px);overflow-y:auto;
}
.c360t-track-menu-head{padding:8px 12px 10px;border-bottom:1px solid var(--line-soft);margin-bottom:6px;}
.c360t-track-menu-head strong{display:block;font-size:13px;font-weight:600;color:var(--navy);}
.c360t-track-menu-head span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;}
.c360t-track-opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:transparent;border:none;border-radius:10px;padding:11px 12px;cursor:pointer;
  transition:background .14s ease;
}
.c360t-track-opt:hover{background:var(--sand);}
.c360t-track-opt:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;background:var(--sand);}
.c360t-track-opt.is-active{background:var(--blue-tint);}
.c360t-track-opt[disabled]{cursor:not-allowed;opacity:.7;}
.c360t-track-opt[disabled]:hover{background:transparent;}
.c360t-track-opt-main{flex:1;min-width:0;}
.c360t-track-opt-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14.5px;color:var(--navy);line-height:1.25;}
.c360t-track-opt-sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px;}
.c360t-track-check{flex-shrink:0;width:18px;height:18px;color:var(--green);margin-top:1px;}
.c360t-soon{
  display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  background:var(--green);color:#fff;border-radius:5px;padding:3px 5px;vertical-align:middle;
}
.c360t-searchwrap{position:relative;flex:1;min-width:220px;max-width:340px;}
.c360t-search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);}
#c360t-search{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--white);border:1.5px solid var(--line);border-radius:999px;
  padding:12px 16px 12px 42px;outline:none;transition:border-color .18s ease,box-shadow .18s ease;
}
#c360t-search:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,32,120,.12);}

/* breadcrumb */
.c360t-crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px;min-height:18px;}
.c360t-crumbs a{color:var(--muted);text-decoration:none;cursor:pointer;font-weight:500;}
.c360t-crumbs a:hover{color:var(--green);}
.c360t-crumbs .sep{color:var(--line);}
.c360t-crumbs .cur{color:var(--navy);font-weight:600;}

/* section head */
.c360t-head{margin-bottom:24px;}
.c360t-head .eyebrow{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--green);display:block;margin-bottom:8px;}
.c360t-head h2{font-weight:700;font-size:clamp(24px,4vw,34px);letter-spacing:-.3px;color:var(--navy);margin:0;line-height:1.1;}
.c360t-head p{margin:10px 0 0;color:var(--muted);font-size:15px;max-width:62ch;line-height:1.55;}

/* card grid */
.c360t-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
.c360t-card{
  position:relative;text-align:left;cursor:pointer;background:var(--white);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 22px 22px 26px;overflow:hidden;font-family:inherit;color:inherit;width:100%;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.c360t-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green);transition:width .16s ease;}
.c360t-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent;}
.c360t-card:hover::before{width:9px;}
.c360t-card:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
.c360t-card.is-locked{cursor:not-allowed;opacity:.62;}
.c360t-card.is-locked:hover{transform:none;box-shadow:none;border-color:var(--line);}
.c360t-card.is-locked::before{background:var(--muted);}
.c360t-card .ix{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:12px;}
.c360t-card h3{font-weight:600;font-size:19px;line-height:1.2;color:var(--navy);margin:0 0 8px;letter-spacing:-.2px;}
.c360t-card p{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0;}
.c360t-card .meta{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
.c360t-chip{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--navy);background:var(--sand);border:1px solid var(--line);border-radius:6px;padding:4px 8px;}
.c360t-count{margin-left:auto;font-weight:600;font-size:13px;color:var(--green);display:flex;align-items:center;gap:5px;}
.c360t-count svg{width:15px;height:15px;}
.c360t-lockbadge{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sand);border:1px solid var(--line);border-radius:6px;padding:4px 8px;}
.c360t-audio-chip{color:var(--green);}

/* empty */
.c360t-empty{text-align:center;padding:60px 20px;color:var(--muted);display:flex;flex-direction:column;gap:6px;}
.c360t-empty strong{font-size:20px;color:var(--navy);font-weight:600;}

/* ============================================================
   MODAL
   ============================================================ */
.c360t-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);}
.c360t-modal[hidden]{display:none;}
.c360t-modal-backdrop{position:absolute;inset:0;background:rgba(13,22,84,.6);backdrop-filter:blur(3px);}
.c360t-modal-card{
  position:relative;z-index:1;background:var(--white);border-radius:16px;overflow:hidden;
  width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
  animation:c360t-pop .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes c360t-pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
.c360t-modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;background:var(--navy);color:#fff;}
.c360t-modal-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#A9B7E0;display:block;margin-bottom:3px;font-weight:500;}
.c360t-modal-title{font-weight:600;font-size:20px;margin:0;line-height:1.15;color:#fff !important;}
.c360t-modal-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.c360t-btn{
  font-family:inherit;font-weight:600;letter-spacing:.02em;font-size:13px;border-radius:8px;
  padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .15s ease;border:none;
}
.c360t-btn-copy{background:var(--green);color:#fff;}
.c360t-btn-copy:hover{background:var(--green-deep);}
.c360t-btn-copy.is-copied{background:#1f8a4c;}
.c360t-modal-x{background:rgba(255,255,255,.14);color:#fff;border:none;width:38px;height:38px;border-radius:8px;font-size:24px;line-height:1;cursor:pointer;transition:background .15s ease;}
.c360t-modal-x:hover{background:rgba(255,255,255,.26);}
.c360t-modal-body{flex:1;overflow:auto;background:var(--white);min-height:240px;}

/* audio player */
.c360t-audiowrap{max-width:760px;margin:0 auto;padding:24px clamp(20px,4vw,48px) 4px;}
.c360t-audio-eyebrow{font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.c360t-audio{display:flex;align-items:center;gap:14px;background:var(--navy);border-radius:12px;padding:13px 16px;margin-bottom:12px;}
.c360t-audio-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.c360t-audio-btn:hover{background:var(--green-light);}
.c360t-audio-main{flex:1;min-width:0;}
.c360t-audio-label{font-weight:600;font-size:14px;letter-spacing:.01em;color:#fff;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c360t-audio-bar{height:6px;background:rgba(255,255,255,.22);border-radius:3px;cursor:pointer;position:relative;}
.c360t-audio-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green-light);border-radius:3px;}
.c360t-audio-time{flex-shrink:0;font-variant-numeric:tabular-nums;font-size:12.5px;color:#A9B7E0;min-width:88px;text-align:right;}

/* native document styling */

<p class="lead">A managed listing-sync service, powered by Yext, that pushes a business's name, address, phone, hours, and photos to 70+ directories, maps, and AI search platforms (Google, Apple Maps, Bing, Yelp, ChatGPT, Perplexity, Siri) from one dashboard. One update keeps them accurate everywhere, forever.</p>
<div class="c360t-callout">It doesn't matter how good you look on Google if you look wrong or missing everywhere else, because that inconsistency is dragging your Google ranking down too, and it's making you invisible to AI search entirely.</div>
<h3>The Problem We Solve</h3>
<ul>
<li><strong>Search has split.</strong> People no longer just Google things. They ask ChatGPT, Siri, Perplexity, and Alexa for the best plumber near them. Those tools pull answers from directory data, not just Google.</li>
<li><strong>Directory data drifts and breaks.</strong> Old addresses, duplicate listings, wrong hours, and inconsistent phone numbers pile up across dozens of sites over the years. Most owners have no idea this exists.</li>
<li><strong>Inconsistent data actively hurts rankings.</strong> Google cross-references business data across the web. When it doesn't match, Google treats it as an unreliable signal and ranks the business lower, even if their Google profile looks perfect.</li>
<li><strong>AI won't recommend what it can't verify.</strong> If listing data is missing or wrong on the platforms AI models pull from, the business is invisible to AI search regardless of how good their reviews are.</li>
</ul>
<h3>What's Included</h3>
<ul>
<li>70+ directory and AI platform listings (Google, Apple Maps, Bing, Yelp, ChatGPT, Perplexity, and more)</li>
<li>Real-time NAP sync: name, address, phone, automatically corrected everywhere</li>
<li>Duplicate listing suppression, killing old and conflicting listings that hurt rankings</li>
<li>Rich listing content: photos, hours, services, not just name and address</li>
<li>AI search optimization, structured so AI assistants can actually cite the business</li>
<li>Scheduled update management: holiday hours and promos pushed everywhere at once</li>
<li>Google Q&amp;A management</li>
<li>Performance analytics dashboard: impressions, clicks, calls, direction requests</li>
</ul>
<h3>Timeline</h3>
<p>Most platforms (Google, Yelp, Facebook, Bing) go live within the first week. Full sync across all 70+ including Apple Maps typically takes 3 to 7 days, up to 2 to 4 weeks for full completion on slower platforms.</p>

      }
    }
  };
  /* ===================================================================== */
  /*  ▲▲▲  END OF EDIT ZONE  ▲▲▲                                           */
  /* ===================================================================== */


  const $=(id)=>document.getElementById(id);

  /* ============ PASSWORD GATE ============ */
  const gate=$('c360t-gate'), gallery=$('c360t-gallery'),
        gateForm=$('c360t-gate-form'), gateInput=$('c360t-gate-input'),
        gateError=$('c360t-gate-error'), gateCard=gate.querySelector('.c360t-gate-card'),
        gateEye=$('c360t-gate-eye');

  function unlock(){
    gate.hidden=true;
    gallery.hidden=false;
    render();
  }
  function isUnlocked(){
    try{ return sessionStorage.getItem(GATE_KEY)==="1"; }catch(e){ return false; }
  }
  function rememberUnlock(){
    try{ sessionStorage.setItem(GATE_KEY,"1"); }catch(e){}
  }

  gateForm.addEventListener('submit',function(e){
    e.preventDefault();
    if(gateInput.value===GATE_PASSWORD){
      rememberUnlock();
      unlock();
    } else {
      gateError.hidden=false;
      gateCard.classList.remove('c360t-shake');
      void gateCard.offsetWidth; // reflow to restart animation
      gateCard.classList.add('c360t-shake');
      gateInput.select();
    }
  });
  gateInput.addEventListener('input',function(){ gateError.hidden=true; });
  gateEye.addEventListener('click',function(){
    const show=gateInput.type==="password";
    gateInput.type=show?"text":"password";
    gateEye.setAttribute('aria-label',show?"Hide password":"Show password");
    gateInput.focus();
  });

  /* ============ GALLERY ============ */
  const elBrandbar=$('c360t-brandbar'), elCrumbs=$('c360t-crumbs'), elHead=$('c360t-head'),
        elGrid=$('c360t-grid'), elEmpty=$('c360t-empty'), elSearch=$('c360t-search'),
        elModal=$('c360t-modal'), elModalTitle=$('c360t-modal-title'),
        elModalEyebrow=$('c360t-modal-eyebrow'), elModalBody=$('c360t-modal-body'),
        elModalCopy=$('c360t-modal-copy');

  const firstUnlocked=Object.keys(DATA).find(k=>!DATA[k].locked)||Object.keys(DATA)[0];
  let state={brand:firstUnlocked, category:null, query:""};
  let lastFocus=null;
  const isLocked=(o)=>!!(o&&o.locked);
  const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const hasContent=(t)=>!!(t.content&&t.content.trim());
  const brand=()=>DATA[state.brand];

  function clips(t){
    if(!t.audio) return [];
    const arr=Array.isArray(t.audio)?t.audio:[t.audio];
    return arr.filter(Boolean).map((a,idx)=>{
      if(typeof a==='string') return {src:a,label:'Example call'+(arr.length>1?(' '+(idx+1)):'')};
      return {src:a.src,label:a.label||('Example call'+(arr.length>1?(' '+(idx+1)):''))};
    });
  }
  const isReady=(t)=>hasContent(t)||clips(t).length>0;
  const fmtTime=(s)=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

  function audioBlock(c){
    return `<div class="c360t-audio">
      <button class="c360t-audio-btn" type="button" aria-label="Play">▶</button>
      <div class="c360t-audio-main">
        <div class="c360t-audio-label">${esc(c.label)}</div>
        <div class="c360t-audio-bar"><div class="c360t-audio-fill"></div></div>
      </div>
      <div class="c360t-audio-time">0:00</div>
      <audio preload="none" src="${esc(c.src)}"></audio>
    </div>`;
  }
  function initAudio(scope){
    scope.querySelectorAll('.c360t-audio').forEach(box=>{
      const audio=box.querySelector('audio'), btn=box.querySelector('.c360t-audio-btn'),
            fill=box.querySelector('.c360t-audio-fill'), bar=box.querySelector('.c360t-audio-bar'),
            time=box.querySelector('.c360t-audio-time');
      btn.addEventListener('click',()=>{
        if(audio.paused){ scope.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause();}); audio.play().catch(()=>{}); }
        else audio.pause();
      });
      audio.addEventListener('play',()=>{btn.textContent='⏸';btn.setAttribute('aria-label','Pause');});
      audio.addEventListener('pause',()=>{btn.textContent='▶';btn.setAttribute('aria-label','Play');});
      audio.addEventListener('ended',()=>{btn.textContent='▶';fill.style.width='0%';});
      audio.addEventListener('loadedmetadata',()=>{time.textContent='0:00 / '+fmtTime(audio.duration);});
      audio.addEventListener('timeupdate',()=>{
        const d=audio.duration||0; fill.style.width=(d?audio.currentTime/d*100:0)+'%';
        time.textContent=fmtTime(audio.currentTime)+' / '+fmtTime(d);
      });
      bar.addEventListener('click',e=>{const r=bar.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;});
    });
  }

  function allTemplates(b){
    const out=[];
    Object.entries(b.categories).forEach(([ck,cat])=>{
      (cat.templates||[]).forEach((t,i)=>out.push({...t,_cat:ck,_catName:cat.name,_i:i}));
    });
    return out;
  }

  function renderBrands(){
    const chev='<svg class="c360t-track-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    const check='<svg class="c360t-track-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
    const folder='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
    const cur=brand();
    const opts=Object.entries(DATA).map(([key,b])=>{
      const active=key===state.brand;
      const locked=isLocked(b);
      const soon=locked?`<span class="c360t-soon">SOON</span>`:"";
      return `<button type="button" class="c360t-track-opt ${active?'is-active':''}" role="option" aria-selected="${active}" data-brand="${key}" ${locked?'disabled aria-disabled="true"':''}>`
        +`<span class="c360t-track-opt-main"><span class="c360t-track-opt-name">${esc(b.name)}${soon}</span>`
        +`<span class="c360t-track-opt-sub">${esc(b.blurb||"")}</span></span>`
        +`${active?check:""}</button>`;
    }).join("");
    elBrandbar.innerHTML=
      `<span class="c360t-track-label" id="c360t-track-label">${folder} Training track</span>`
      +`<button type="button" class="c360t-track-trigger" id="c360t-track-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="c360t-track-label">`
      +`<span class="c360t-track-trig-main"><span class="c360t-track-trig-name">${esc(cur.name)}</span>`
      +`<span class="c360t-track-trig-sub">${esc(cur.blurb||"")}</span></span>${chev}</button>`
      +`<div class="c360t-track-menu" id="c360t-track-menu" role="listbox" aria-labelledby="c360t-track-label" hidden>`
      +`<div class="c360t-track-menu-head"><strong>Switch training track</strong>`
      +`<span>Pick the product you're selling &mdash; the cards below update to match. Tracks marked &ldquo;Soon&rdquo; aren't ready yet.</span></div>`
      +`${opts}</div>`;
  }
  function renderCrumbs(){
    const b=brand();
    let html=`<a data-go="brand">${esc(b.name)}</a>`;
    if(state.query) html+=`<span class="sep">/</span><span class="cur">Search: “${esc(state.query)}”</span>`;
    else if(state.category) html+=`<span class="sep">/</span><span class="cur">${esc(b.categories[state.category].name)}</span>`;
    elCrumbs.innerHTML=html;
  }
  function renderHead(){
    const b=brand();
    let eyebrow=b.name,title=b.name,sub=b.blurb||"";
    if(state.query){eyebrow=b.name+" · Results";title=`“${state.query}”`;sub="";}
    else if(state.category){const c=b.categories[state.category];eyebrow=b.name;title=c.name;sub=c.blurb||"";}
    elHead.innerHTML=`<span class="eyebrow">${esc(eyebrow)}</span><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:""}`;
  }

  const docIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5M8 13h8M8 17h8M8 9h2"/><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>';

  function renderGrid(){
    const b=brand(); let cards="";
    if(state.query){
      const q=state.query.toLowerCase();
      const hits=allTemplates(b).filter(t=>(t.title+" "+(t.desc||"")+" "+(t.tag||"")+" "+t._catName).toLowerCase().includes(q));
      cards=hits.map(templateCard).join(""); showGrid(cards,hits.length);
    } else if(!state.category){
      const entries=Object.entries(b.categories);
      cards=entries.map(([key,cat],idx)=>{
        const n=(cat.templates||[]).length;
        if(isLocked(cat)||n===0){
          return `<button class="c360t-card is-locked" disabled><span class="ix">${String(idx+1).padStart(2,'0')}</span><h3>${esc(cat.name)}</h3><p>${esc(cat.blurb||"Content is being added.")}</p><div class="meta"><span class="c360t-lockbadge">Coming soon</span></div></button>`;
        }
        return `<button class="c360t-card" data-cat="${key}"><span class="ix">${String(idx+1).padStart(2,'0')}</span><h3>${esc(cat.name)}</h3><p>${esc(cat.blurb||"")}</p><div class="meta"><span class="c360t-count">${docIcon}${n} item${n>1?'s':''}</span></div></button>`;
      }).join(""); showGrid(cards,entries.length);
    } else {
      const cat=b.categories[state.category];
      cards=(cat.templates||[]).map((t,i)=>templateCard({...t,_cat:state.category,_catName:cat.name,_i:i})).join("");
      showGrid(cards,(cat.templates||[]).length);
    }
  }
  function templateCard(t){
    const ready=isReady(t); const hasAudio=clips(t).length>0;
    return `<button class="c360t-card" data-open="${t._cat}:${t._i}"><span class="ix">${esc(t._catName)}</span><h3>${esc(t.title)}</h3><p>${esc(t.desc||"")}</p><div class="meta">${t.tag?`<span class="c360t-chip">${esc(t.tag)}</span>`:""}${hasAudio?`<span class="c360t-chip c360t-audio-chip">▶ Audio</span>`:""}<span class="c360t-count">${docIcon}${ready?"Open":"Soon"}</span></div></button>`;
  }
  function showGrid(html,count){
    elGrid.innerHTML=html; const empty=count===0;
    elEmpty.hidden=!empty; elGrid.style.display=empty?"none":"grid";
  }
  function render(){renderBrands();renderCrumbs();renderHead();renderGrid();}

  /* ---- modal ---- */
  let currentText="";
  function openModal(catKey,i){
    const t=brand().categories[catKey].templates[i];
    lastFocus=document.activeElement;
    elModalEyebrow.textContent=brand().name+" · "+brand().categories[catKey].name;
    elModalTitle.textContent=t.title.replace(/[“”]/g,'"');
    const cl=clips(t);
    let html="";
    if(cl.length){
      html+=`<div class="c360t-audiowrap"><div class="c360t-audio-eyebrow">Example call${cl.length>1?"s":""}</div>`;
      cl.forEach(c=>{ html+=audioBlock(c); });
      html+=`</div>`;
    }
    if(hasContent(t)) html+=`<article class="c360t-doc">${t.content}</article>`;
    if(!cl.length && !hasContent(t)){
      html=`<div class="c360t-docph"><div class="ico">📄</div><strong>Content coming soon</strong><p>This item's content will appear here once it's added to the <code>content</code> field.</p></div>`;
    }
    elModalBody.innerHTML=html;
    if(hasContent(t)){ currentText=elModalBody.querySelector('.c360t-doc').innerText.trim(); elModalCopy.style.display=""; }
    else { currentText=""; elModalCopy.style.display="none"; }
    initAudio(elModalBody);
    elModalCopy.textContent="Copy text"; elModalCopy.classList.remove('is-copied');
    elModal.hidden=false; document.body.style.overflow="hidden";
    elModalBody.scrollTop=0;
    elModal.querySelector('.c360t-modal-x').focus();
  }
  function closeModal(){
    elModalBody.querySelectorAll('audio').forEach(a=>a.pause());
    elModal.hidden=true; elModalBody.innerHTML=""; currentText="";
    document.body.style.overflow=""; if(lastFocus) lastFocus.focus();
  }
  function copyText(){
    if(!currentText) return;
    const done=()=>{elModalCopy.textContent="Copied ✓";elModalCopy.classList.add('is-copied');
      setTimeout(()=>{elModalCopy.textContent="Copy text";elModalCopy.classList.remove('is-copied');},1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(currentText).then(done).catch(fallbackCopy);
    } else fallbackCopy();
    function fallbackCopy(){
      const ta=document.createElement('textarea');ta.value=currentText;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);
    }
  }

  /* ---- events ---- */
  const trackTrigger=()=>document.getElementById('c360t-track-trigger');
  const trackMenu=()=>document.getElementById('c360t-track-menu');
  function closeTrack(){const t=trackTrigger(),m=trackMenu();if(t)t.setAttribute('aria-expanded','false');if(m)m.hidden=true;}
  function openTrack(){const t=trackTrigger(),m=trackMenu();if(!t||!m)return;t.setAttribute('aria-expanded','true');m.hidden=false;const f=m.querySelector('.c360t-track-opt:not([disabled])');if(f)f.focus();}
  function toggleTrack(){const t=trackTrigger();(t&&t.getAttribute('aria-expanded')==='true')?closeTrack():openTrack();}

  elBrandbar.addEventListener('click',e=>{
    if(e.target.closest('#c360t-track-trigger')){toggleTrack();return;}
    const opt=e.target.closest('[data-brand]');
    if(!opt||opt.disabled)return;
    state.brand=opt.dataset.brand;state.category=null;state.query="";elSearch.value="";
    render(); // rebuilds the picker in its closed state
  });
  elBrandbar.addEventListener('keydown',e=>{
    const m=trackMenu();
    if(e.target.id==='c360t-track-trigger'&&e.key==='ArrowDown'&&(!m||m.hidden)){e.preventDefault();openTrack();return;}
    if(!m||m.hidden)return;
    const list=[...m.querySelectorAll('.c360t-track-opt:not([disabled])')];
    const i=list.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(list[i+1]||list[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(list[i-1]||list[list.length-1]).focus();}
    else if(e.key==='Home'){e.preventDefault();list[0]&&list[0].focus();}
    else if(e.key==='End'){e.preventDefault();list[list.length-1]&&list[list.length-1].focus();}
  });
  document.addEventListener('click',e=>{if(!e.target.closest('#c360t-brandbar'))closeTrack();});
  elCrumbs.addEventListener('click',e=>{if(!e.target.closest('[data-go="brand"]'))return;state.category=null;state.query="";elSearch.value="";render();});
  elGrid.addEventListener('click',e=>{const card=e.target.closest('.c360t-card');if(!card||card.disabled)return;if(card.dataset.cat){state.category=card.dataset.cat;render();}else if(card.dataset.open){const[c,i]=card.dataset.open.split(':');openModal(c,Number(i));}});
  let typingTimer;
  elSearch.addEventListener('input',e=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>{state.query=e.target.value.trim();render();},120);});
  elModal.addEventListener('click',e=>{if(e.target.hasAttribute('data-close'))closeModal();});
  elModalCopy.addEventListener('click',copyText);
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(!elModal.hidden){closeModal();return;}
    const m=trackMenu();
    if(m&&!m.hidden){closeTrack();const t=trackTrigger();if(t)t.focus();}
  });

  /* ---- boot ---- */
  if(isUnlocked()){ unlock(); }
  else { gateInput.focus(); }

})();
</script>

      summary:"8 to 12 organic Facebook and Instagram posts a month.",
      glance:["$249/mo","$174/mo (12-Month)","None"],
      rows:[
        ["Monthly","$249/mo","$249","Month-to-month, 10 days' notice to cancel."],
        ["6-Month","$1,195 paid in full","$199","Save $299.","Most Popular"],
        ["12-Month","$2,092 paid in full","$174","Save $896."]
      ],
      notes:["Organic posting only. Facebook and Instagram at one price. Paid Meta Ads are a separate service."]
    },
    {
      id:"websites", track:"web", src:"playbook", name:"Websites & ProCard",
      kw:"website websites procard essentials pro premium web design",
      summary:"Conversion-focused websites with hosting, security and edits included.",
      cols:["Plan","Build (one-time)","Monthly","Includes"],
      glance:["$999 + $97/mo","—","Build fee is one-time"],
      rows:[
        ["Essentials","$999","$97/mo","4 pages. Live in about 7 to 10 business days."],
        ["Pro","$1,499","$97/mo","6 pages with service pages, reviews and on-page SEO. About 2 weeks.","Most Popular"],
        ["Premium","$1,999","$197/mo","8 to 9 pages, blog and automation. About 3 to 4 weeks."]
      ],
      notes:["Monthly covers hosting, security and ongoing edits. 10 days' notice to cancel; the client keeps rights to their content."]
    },
    {
      id:"crm", track:"crm", src:"playbook", name:"CRM Platform",
      kw:"crm platform starter unlimited enterprise",
      summary:"All-in-one CRM, phone, text, booking and review automation.",
      cols:["Plan","Monthly","Annual billing","Includes"],
      glance:["$199/mo","Annual saves 2 months","None"],
      rows:[
        ["Starter","$199/mo","Save $398/yr","2 users, 1,000 contacts, 1 location."],
        ["Unlimited","$299/mo","Save $598/yr","5 users, unlimited contacts, power dialer, unlimited workflows.","Most Popular"],
        ["Enterprise","$499/mo","Save $998/yr","Unlimited users & locations, dedicated account manager."]
      ],
      notes:[
        "14-day free trial on every plan. No money-back guarantee: payments are non-refundable from purchase.",
        "Usage (calls, SMS, email) is billed separately and non-refundable, typically $6 to $10/mo for a service business."
      ]
    },
    {
      id:"ai-agents", track:"ai", src:"playbook", name:"AI Agents",
      kw:"ai agents voice agent assistant receptionist",
      summary:"AI Voice Agent (phones) and AI Assistant (phones, chat, SMS, reviews).",
      cols:["Product","Monthly","Setup","Annual"],
      glance:["$399/mo + $2,000 setup","—","$2,000 one-time, non-refundable"],
      rows:[
        ["AI Voice Agent","$399/mo","$2,000","$3,990 (unconfirmed)"],
        ["AI Assistant","$599/mo","$2,000","$5,990 (unconfirmed)"]
      ],
      confirm:["The playbook flags these figures as different from the brand pricing sheet. Confirm with management before quoting any AI Agents price."]
    }
  ];
  /* ======================= END OF EDIT ZONE ======================= */

  const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const SRC={sheet:"October 2026 price list",playbook:"From the training playbook"};

  function rowsTable(p){
    const cols=p.cols||["Term","Price","Per month","Notes"];
    const body=p.rows.map(r=>{
      const badge=r[4]?`<span class="c360p-badge">${esc(r[4])}</span>`:"";
      return `<tr><td class="c360p-term">${esc(r[0])}${badge}</td><td class="c360p-price">${esc(r[1])}</td><td class="c360p-eff">${esc(r[2])}</td><td class="c360p-notes">${esc(r[3])}</td></tr>`;
    }).join("");
    return `<div class="c360p-tablewrap"><table class="c360p-table"><thead><tr>${cols.map(c=>`<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function productHTML(p){
    let h=`<section class="c360p-prod" id="c360p-${p.id}" data-kw="${esc((p.name+" "+(p.kw||"")).toLowerCase())}">`;
    h+=`<div class="c360p-prod-top"><div><h3>${esc(p.name)}</h3>${p.summary?`<p>${esc(p.summary)}</p>`:""}</div><span class="c360p-src is-${p.src}">${SRC[p.src]}</span></div>`;
    h+=rowsTable(p);
    if(p.notes&&p.notes.length) h+=`<ul class="c360p-notes">${p.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`;
    (p.confirm||[]).forEach(c=>{h+=`<div class="c360p-confirm"><strong>Confirm before quoting:</strong> ${esc(c)}</div>`;});
    if(p.promos&&p.promos.length){
      h+=`<div class="c360p-promo"><p class="c360p-promo-title">Promotions &amp; discounts</p>`;
      if(p.promoConfirm) h+=`<div class="c360p-confirm" style="margin:0 0 10px"><strong>Confirm before offering:</strong> ${esc(p.promoConfirm)}</div>`;
      h+=`<dl>${p.promos.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl></div>`;
    }
    h+=`<button type="button" class="c360p-top-btn" data-top>Back to top of price sheet</button></section>`;
    return h;
  }

  function panelHTML(){
    const glanceRows=PRICING.map(p=>`<tr class="c360p-glance-row" data-jump="${p.id}" data-kw="${esc((p.name+" "+(p.kw||"")).toLowerCase())}"><td><button type="button" class="c360p-rowlink" data-jump="${p.id}">${esc(p.name)}</button></td><td class="c360p-price">${esc(p.glance[0])}</td><td class="c360p-eff">${esc(p.glance[1])}</td><td class="c360p-notes">${esc(p.glance[2])}</td></tr>`).join("");
    return `<div class="c360p-head" id="c360p-top">
        <div><h2>Price Sheet</h2><p>Every product’s pricing in one place. Prices marked “October 2026 price list” are <span class="c360p-asof">as of ${esc(AS_OF)}</span>; the rest come from the training playbooks.</p></div>
        <button type="button" class="c360p-back" data-close>Back to training</button>
      </div>
      <div class="c360p-controls">
        <div class="c360p-find">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" class="c360p-find-input" id="c360p-find" placeholder="Find a product…" aria-label="Find a product" autocomplete="off">
        </div>
        <label class="c360p-switch"><input type="checkbox" id="c360p-promos"> Show promotions &amp; discounts</label>
      </div>
      <div class="c360p-mytrack" id="c360p-mytrack" hidden></div>
      <ul class="c360p-chips">${PRICING.map(p=>`<li><button type="button" class="c360p-chip" data-jump="${p.id}" data-kw="${esc((p.name+" "+(p.kw||"")).toLowerCase())}">${esc(p.name)}</button></li>`).join("")}</ul>
      <div class="c360p-glance">
        <h3>At a glance</h3>
        <div class="c360p-tablewrap"><table class="c360p-table"><thead><tr><th scope="col">Product</th><th scope="col">Starts at</th><th scope="col">Lowest rate</th><th scope="col">Setup</th></tr></thead><tbody>${glanceRows}</tbody></table></div>
      </div>
      <div id="c360p-list">${PRICING.map(productHTML).join("")}</div>
      <p class="c360p-none" id="c360p-none" hidden>No product matches that search. Try “LSA”, “posting” or “website”.</p>
      <p class="c360p-foot">Meta Ads — Fully Managed has no published pricing yet.</p>`;
  }

  function boot(){
    const app=document.getElementById("c360t-app");
    const top=app&&app.querySelector(".c360t-top");
    const inner=app&&app.querySelector(".c360t-inner");
    if(!top||!inner){ setTimeout(boot,100); return; }
    if(window.__c360pReady) return;
    window.__c360pReady=true;

    const btn=document.createElement("button");
    btn.type="button"; btn.className="c360p-open"; btn.id="c360p-open";
    btn.setAttribute("aria-pressed","false"); btn.setAttribute("aria-controls","c360p");
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Price Sheet';
    const searchWrap=top.querySelector(".c360t-searchwrap");
    if(searchWrap) top.insertBefore(btn,searchWrap); else top.appendChild(btn);

    const panel=document.createElement("section");
    panel.className="c360p"; panel.id="c360p"; panel.hidden=true;
    panel.setAttribute("aria-label","Price sheet");
    panel.innerHTML=panelHTML();
    top.insertAdjacentElement("afterend",panel);

    const find=panel.querySelector("#c360p-find");
    const promos=panel.querySelector("#c360p-promos");
    const myTrack=panel.querySelector("#c360p-mytrack");
    const none=panel.querySelector("#c360p-none");

    function activeTrack(){
      const o=app.querySelector("#c360t-brandbar .c360t-track-opt.is-active");
      return o?o.getAttribute("data-brand"):null;
    }
    function updateTrack(){
      const key=activeTrack();
      const matches=PRICING.filter(p=>p.track&&p.track===key);
      if(!matches.length){ myTrack.hidden=true; myTrack.innerHTML=""; return; }
      myTrack.innerHTML=`<span>You’re on the training track for <strong>${esc(matches[0].name.split(" — ")[0])}</strong>.</span>`+
        matches.map(p=>`<button type="button" data-jump="${p.id}">Jump to ${esc(p.name)}</button>`).join("");
      myTrack.hidden=false;
    }
    function openSheet(){
      updateTrack();
      inner.classList.add("c360p-on"); panel.hidden=false;
      btn.classList.add("is-on"); btn.setAttribute("aria-pressed","true");
      panel.scrollIntoView({block:"start"});
    }
    function closeSheet(){
      if(panel.hidden) return;
      inner.classList.remove("c360p-on"); panel.hidden=true;
      btn.classList.remove("is-on"); btn.setAttribute("aria-pressed","false");
    }
    function jump(id){
      const el=panel.querySelector("#c360p-"+id);
      if(!el) return;
      if(el.hidden){ find.value=""; filter(""); }
      el.scrollIntoView({block:"start"});
      el.classList.add("is-flash");
      setTimeout(()=>el.classList.remove("is-flash"),1400);
    }
    function filter(q){
      q=q.trim().toLowerCase(); let shown=0;
      panel.querySelectorAll("section.c360p-prod").forEach(s=>{
        const hit=!q||s.getAttribute("data-kw").indexOf(q)>-1;
        s.hidden=!hit; if(hit) shown++;
      });
      panel.querySelectorAll("tr.c360p-glance-row, button.c360p-chip").forEach(el=>{
        const hit=!q||el.getAttribute("data-kw").indexOf(q)>-1;
        const node=el.tagName==="BUTTON"?el.parentNode:el;
        node.hidden=!hit;
      });
      none.hidden=shown>0;
    }

    btn.addEventListener("click",()=>{ panel.hidden?openSheet():closeSheet(); });
    find.addEventListener("input",e=>filter(e.target.value));
    promos.addEventListener("change",()=>panel.classList.toggle("c360p-promos-on",promos.checked));

    panel.addEventListener("click",e=>{
      const j=e.target.closest("[data-jump]");
      if(j){ jump(j.getAttribute("data-jump")); return; }
      if(e.target.closest("[data-top]")){ panel.scrollIntoView({block:"start"}); return; }
      if(e.target.closest("[data-close]")) closeSheet();
    });

    /* leaving the sheet: picking a track, clicking the breadcrumb, or using the training search */
    document.addEventListener("click",e=>{
      if(e.target.closest("#c360t-brandbar [data-brand]")||e.target.closest("#c360t-crumbs [data-go]")) closeSheet();
    },true);
    const trainingSearch=document.getElementById("c360t-search");
    if(trainingSearch) trainingSearch.addEventListener("input",closeSheet);

    /* ---------- "Pricing" button inside each product track ---------- */
    /* Which price-sheet products show for each training track. */
    const TRACK_PRICING={
      gbpm:["gbp-mgmt","gbp-setup"], gbp:["gbp-setup","gbp-mgmt"], gsp:["google-posting"],
      seo:["local-seo"], lsa:["lsa","platinum"], gads:["google-ads"],
      geo:["geo-mobile","geo-ctv"], msp:["meta-posting"], web:["websites"],
      crm:["crm"], ai:["ai-agents"], platinum:["platinum"]
    };
    const head=document.getElementById("c360t-head");
    const modal=document.getElementById("c360t-modal");
    const mTitle=document.getElementById("c360t-modal-title");
    const mEyebrow=document.getElementById("c360t-modal-eyebrow");
    const mBody=document.getElementById("c360t-modal-body");
    const mCopy=document.getElementById("c360t-modal-copy");
    const tagIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>';

    function trackProducts(){
      const ids=TRACK_PRICING[activeTrack()]||[];
      return ids.map(id=>PRICING.find(p=>p.id===id)).filter(Boolean);
    }
    function addTrackButton(){
      if(!head||head.querySelector(".c360p-trackbtn")) return;
      const prods=trackProducts();
      if(!prods.length) return;
      const b=document.createElement("button");
      b.type="button"; b.className="c360p-trackbtn";
      b.innerHTML=tagIcon+"View pricing";
      head.appendChild(b);
    }
    function openTrackPricing(){
      const prods=trackProducts();
      if(!prods.length||!modal) return;
      const trackName=(app.querySelector(".c360t-track-trig-name")||{}).textContent||"Product";
      mEyebrow.textContent="Price sheet · as of "+AS_OF;
      mTitle.textContent=trackName+" pricing";
      mBody.innerHTML=`<div class="c360p c360p-modal">
          <div class="c360p-modal-bar">
            <p>Standard pricing for this product.</p>
            <label class="c360p-switch"><input type="checkbox" class="c360p-modal-promos"> Show promotions &amp; discounts</label>
          </div>
          ${prods.map(productHTML).join("")}
          <button type="button" class="c360p-fullsheet">Open the full price sheet for every product</button>
        </div>`;
      if(mCopy) mCopy.style.display="none";
      modal.hidden=false; document.body.style.overflow="hidden"; mBody.scrollTop=0;
      const x=modal.querySelector(".c360t-modal-x"); if(x) x.focus();
    }
    function closeModalBox(){
      modal.hidden=true; mBody.innerHTML=""; document.body.style.overflow="";
    }

    if(head){
      new MutationObserver(addTrackButton).observe(head,{childList:true});
      addTrackButton();
      head.addEventListener("click",e=>{ if(e.target.closest(".c360p-trackbtn")) openTrackPricing(); });
    }
    if(mBody){
      mBody.addEventListener("change",e=>{
        if(e.target.classList.contains("c360p-modal-promos")){
          const wrap=mBody.querySelector(".c360p-modal");
          if(wrap) wrap.classList.toggle("c360p-promos-on",e.target.checked);
        }
      });
      mBody.addEventListener("click",e=>{
        if(e.target.closest(".c360p-fullsheet")){ closeModalBox(); openSheet(); }
      });
    }
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
